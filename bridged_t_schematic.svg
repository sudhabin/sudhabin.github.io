<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#336633" />
      <stop offset="100%" stop-color="#254d25" />
    </linearGradient>
    <pattern id="millimeterGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e7decb" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background in Sudhabin Theme (Warm Paper / Cream) -->
  <rect width="100%" height="100%" fill="#fcfaf6" rx="10"/>
  <rect width="100%" height="100%" fill="url(#millimeterGrid)" rx="10"/>
  <rect width="100%" height="100%" fill="none" stroke="#cc9966" stroke-width="2" rx="10"/>
  <rect x="4" y="4" width="672" height="352" fill="none" stroke="#996600" stroke-width="1" rx="8" opacity="0.6"/>

  <!-- Theme Header Banner -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="640" height="44" rx="6" fill="url(#headerGrad)" stroke="#996600" stroke-width="1.5"/>
    <text x="20" y="24" fill="#ffffff" font-family="'Trebuchet MS', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">BRIDGED-T ATTENUATOR</text>
    <text x="20" y="37" fill="#ecd9b8" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11">Dual-Variable Control: R_bridge · R_shunt = Z₀²</text>
    <rect x="530" y="10" width="120" height="24" rx="4" fill="#254d25" stroke="#cc9966" stroke-width="1"/>
    <text x="590" y="26" fill="#fef3c7" font-family="'Trebuchet MS', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">MICROWAVE CAD</text>
  </g>

  <!-- Schematic Drawing Area -->
  
  <line x1="80" y1="280" x2="600" y2="280" stroke="#78716c" stroke-width="2.5"/>
  
    <line x1="340" y1="280" x2="340" y2="296" stroke="#78716c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="324" y1="296" x2="356" y2="296" stroke="#78716c" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="302" x2="350" y2="302" stroke="#78716c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="336" y1="308" x2="344" y2="308" stroke="#78716c" stroke-width="2" stroke-linecap="round"/>
  

  <!-- Bridge Path -->
  <line x1="160" y1="150" x2="160" y2="90" stroke="#333399" stroke-width="2.5"/>
  <line x1="160" y1="90" x2="275" y2="90" stroke="#333399" stroke-width="2.5"/>
  <path d="M 275 90 h 10 L 291.875 76 L 305.625 104 L 319.375 76 L 333.125 104 L 346.875 76 L 360.625 104 L 374.375 76 L 388.125 104 L 395 90 h 10" fill="none" stroke="#333399" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="405" y1="90" x2="520" y2="90" stroke="#333399" stroke-width="2.5"/>
  <line x1="520" y1="90" x2="520" y2="150" stroke="#333399" stroke-width="2.5"/>

  <g transform="translate(340, 60)">
    <rect x="-52" y="-13" width="104" height="24" rx="4" fill="#ffffff" stroke="#333399" stroke-width="1.5"/>
    <text x="0" y="4" fill="#1e1b4b" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R_bridge (R4)</text>
  </g>
  <text x="340" y="118" fill="#78716c" font-family="'Trebuchet MS', monospace" font-size="11" font-weight="600" text-anchor="middle">Z₀ · (K - 1)</text>

  <!-- Main Path -->
  <line x1="80" y1="150" x2="160" y2="150" stroke="#1c1917" stroke-width="2.5"/>
  <line x1="160" y1="150" x2="200" y2="150" stroke="#1c1917" stroke-width="2.5"/>
  <path d="M 200 150 h 10 L 215 138 L 225 162 L 235 138 L 245 162 L 255 138 L 265 162 L 270 150 h 10" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="280" y1="150" x2="340" y2="150" stroke="#1c1917" stroke-width="2.5"/>

  <line x1="340" y1="150" x2="400" y2="150" stroke="#1c1917" stroke-width="2.5"/>
  <path d="M 400 150 h 10 L 415 138 L 425 162 L 435 138 L 445 162 L 455 138 L 465 162 L 470 150 h 10" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="480" y1="150" x2="520" y2="150" stroke="#1c1917" stroke-width="2.5"/>
  <line x1="520" y1="150" x2="600" y2="150" stroke="#1c1917" stroke-width="2.5"/>

  <text x="240" y="180" fill="#9a3412" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R0 = Z₀</text>
  <text x="440" y="180" fill="#9a3412" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R0 = Z₀</text>

  <!-- Shunt -->
  <line x1="340" y1="150" x2="340" y2="185" stroke="#1c1917" stroke-width="2.5"/>
  <path d="M 340 185 v 10 L 328 198.75 L 352 206.25 L 328 213.75 L 352 221.25 L 328 228.75 L 352 236.25 L 340 240 v 10" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="340" y1="250" x2="340" y2="280" stroke="#1c1917" stroke-width="2.5"/>

  <g transform="translate(395, 220)">
    <rect x="-5" y="-12" width="85" height="24" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="37" y="4" fill="#166534" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R_shunt (R3)</text>
    <text x="37" y="24" fill="#78716c" font-family="'Trebuchet MS', monospace" font-size="10" font-weight="600" text-anchor="middle">Z₀ / (K - 1)</text>
  </g>

  <circle cx="160" cy="150" r="4.5" fill="#336633"/>
  <circle cx="340" cy="150" r="4.5" fill="#336633"/>
  <circle cx="520" cy="150" r="4.5" fill="#336633"/>
  <circle cx="340" cy="280" r="4.5" fill="#336633"/>

  
    <circle cx="80" cy="150" r="5" fill="#336633" stroke="#996600" stroke-width="2"/>
    <text x="52" y="138" fill="#1c1917" font-family="'Trebuchet MS', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end">PORT 1</text>
    <text x="52" y="156" fill="#993333" font-family="'Trebuchet MS', monospace" font-size="11" font-weight="600" text-anchor="end">IN (Zin)</text>
  
  
    <circle cx="600" cy="150" r="5" fill="#336633" stroke="#996600" stroke-width="2"/>
    <text x="628" y="138" fill="#1c1917" font-family="'Trebuchet MS', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">PORT 2</text>
    <text x="628" y="156" fill="#993333" font-family="'Trebuchet MS', monospace" font-size="11" font-weight="600" text-anchor="start">OUT (Zout)</text>
  
  

  <!-- Footer Watermark / Status -->
  <line x1="20" y1="336" x2="660" y2="336" stroke="#cc9966" stroke-width="0.8"/>
  <text x="24" y="350" fill="#854d0e" font-family="'Trebuchet MS', Arial, sans-serif" font-size="10" font-weight="600">SUDHABIN.GITHUB.IO • MICROWAVE PLANAR CIRCUITS</text>
  <text x="656" y="350" fill="#78716c" font-family="monospace" font-size="10" text-anchor="end">ATTENUATOR DESIGNER SCHEMATIC</text>
</svg>